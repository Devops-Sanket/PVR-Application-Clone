# ============================================================
# docker-compose.yml — PVR Cinemas Website
# Usage: docker compose up -d
# ============================================================

version: "3.9"

services:
  pvr-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: pvr-cinemas:latest
    container_name: pvr-cinemas-web
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/pvr.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - pvr-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  pvr-network:
    driver: bridge
